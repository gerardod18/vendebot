name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # convex/_generated is an offline stub in the repo; regenerate it so CI never depends on a deployment.
      - run: node scripts/gen-convex-stubs.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
